[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mofbb"
version = "0.1.0"
description = "MOF building-block decomposition, reconstruction, and composition."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Bo Li"}]
dependencies = [
  "ase>=3.22",
  "igraph>=0.11",
  "networkx>=3.0",
  "numpy>=1.23",
  "pymatgen>=2024.1",
  "scipy>=1.10",
  "spglib>=2.0",
  "sympy>=1.12",
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
mofbb-decompose = "mofbb.decompose.cli:main"
mofbb-compose = "mofbb.compose.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mofbb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
