[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mofbbr"
version = "0.1.0"
description = "MOFid SingleNode-inspired decomposition with PORMAKE-style X caps."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Bo Li"}]
dependencies = [
  "ase>=3.22",
  "networkx>=3.0",
  "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
mofbb = "mofbb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mofbb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
